server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: docker
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback
        - id: transaction-service
          uri: http://transaction-service:8082
          predicates:
            - Path=/transaction/**
          filters:
            - name: CircuitBreaker
              args:
                name: transactionServiceCB
                fallbackUri: forward:/fallback
        - id: fraud-engine
          uri: http://fraud-engine:8083
          predicates:
            - Path=/fraud/**
          filters:
            - name: CircuitBreaker
              args:
                name: fraudEngineCB
                fallbackUri: forward:/fallback
        - id: notification-service
          uri: http://notification-service:8084
          predicates:
            - Path=/notification/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCB
                fallbackUri: forward:/fallback
        - id: user-service
          uri: http://user-service:8085
          predicates:
            - Path=/user/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback
        - id: audit-service
          uri: http://audit-service:8086
          predicates:
            - Path=/audit/**
          filters:
            - name: CircuitBreaker
              args:
                name: auditServiceCB
                fallbackUri: forward:/fallback
      default-filters:
        - name: RequestId
        - name: RemoveRequestHeader
          args:
            name: Cookie

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 20
        failureRateThreshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      authServiceCB:
        baseConfig: default
      transactionServiceCB:
        baseConfig: default
      fraudEngineCB:
        baseConfig: default
      notificationServiceCB:
        baseConfig: default
      userServiceCB:
        baseConfig: default
      auditServiceCB:
        baseConfig: default
  timelimiter:
    configs:
      default:
        cancel-running-future: true
        timeout-duration: 2s
    instances:
      default:
        baseConfig: default

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

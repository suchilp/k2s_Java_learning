version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports:
      - 2181:2181

  kafka:
    image: wurstmeister/kafka:2.13-2.8.0
    ports:
      - 9092:9092
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: frauddb
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379

  api-gateway:
    build: ./api-gateway
    ports:
      - 8080:8080
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - auth-service
      - transaction-service

  auth-service:
    build: ./auth-service
    ports:
      - 8081:8081
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres

  transaction-service:
    build: ./transaction-service
    ports:
      - 8082:8082
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - kafka
      - postgres

  fraud-engine:
    build: ./fraud-engine
    ports:
      - 8083:8083
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - kafka
      - auth-service

  notification-service:
    build: ./notification-service
    ports:
      - 8084:8084
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - kafka

  user-service:
    build: ./user-service
    ports:
      - 8085:8085
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres

  audit-service:
    build: ./audit-service
    ports:
      - 8086:8086
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    depends_on:
      - api-gateway

  ml-model:
    build: ./ml-model
    ports:
      - 8000:8000
    depends_on:
      - postgres

volumes:
  postgres_data:
